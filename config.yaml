# Раскладка портов
#   6000 обслуживает grade-ai и detector-14b
#   5000 обслуживает test-gen и detector-4b
#
# На обоих портах по две модели, поэтому поле model в запросе обязательно
# и должно быть либо именем модели, либо одним из её aliases. Всё остальное
# прокси отвергнет с кодом 400. Пустым поле model может быть только там,
# где на порту ровно одна модель.
#
# Проксируются только POST запросы к /v1. У GET нет тела, а значит и поля
# model. Список моделей по GET /v1/models прокси отдаёт сама из этого файла.
#
# Команда запуска у каждой модели своя и лежит в собственном скрипте,
# запуск строкой cmd не поддерживается. Прокси передаёт скрипту VLLM_PORT,
# VLLM_SERVED_NAME, VLLM_SERVER_DEV_MODE=1 и CUDA_VISIBLE_DEVICES, а карту
# выбирает сама, в скрипте её жёстко задавать не нужно. Скрипт обязан
# прокинуть три вещи, иначе прокси не заработает.
#
#   --port "$VLLM_PORT"
#
#   --served-model-name "$VLLM_SERVED_NAME"
#       Без этого будет ошибка 404 на каждый запрос. Запуск идёт скриптом,
#       поэтому aliases в vLLM не передаются, и прокси переписывает поле
#       model в каноническое имя из этого файла.
#
#   --enable-sleep-mode
#       Без этого ручка /sleep вернёт 404, прокси перестанет усыплять модель
#       и будет её останавливать, а каждое переключение станет холодным
#       стартом на минуты вместо секунд.
#
# Параметр gpu-memory-utilization в скрипте задаёт долю всей памяти карты,
# которую vLLM заберёт независимо от размера весов. Что не ушло под веса,
# уйдёт под KV кэш. Значение vram_gb здесь должно совпадать с тем, что
# реально заберёт инстанс, то есть доля умножить на объём карты. Здесь карты
# по 16 ГБ, поэтому 11.2 это 0.7 от 16, а 12.8 это 0.8 от 16.
#
# Железо две карты по 16 ГБ. Одновременно активны максимум две модели, по
# одной на карту, две сразу на одну карту не влезают. Остальные спят, держа
# на карте только CUDA контекст размером asleep_tail_gb. Прокси сама решает,
# кого разбудить и кого усыпить, по входящим запросам.
#
# Сон работает на первом уровне, веса уезжают в RAM. Считайте примерно 10 ГБ
# хостовой памяти на каждую спящую модель.
#
# Каждой модели соответствует ровно одна копия. Несколько копий одной модели
# на две карты по 16 ГБ всё равно не помещаются, поэтому поля replicas нет.
#
# Добавлять модели в этот файл можно без правок кода, но конфиг читается один
# раз при запуске, поэтому любая правка требует перезапуска прокси.
#
# Запас железа на две карты по 16 ГБ при asleep_tail_gb 1.5 это пять моделей.
# Две из них активны, три спят. Проверено симуляцией, пятая модель размером
# до 11 ГБ встаёт почти бесплатно, один холодный старт на десять запросов.
# Пятая на 12.8 ГБ уже не помещается рядом со спящими и даёт холодный старт
# на двух запросах из трёх. Шестая и дальше резидентной не станет вовсе,
# её будут останавливать на каждом переключении. Прокси предупредит об этом
# строкой в логе про то, что места держать модель спящей рядом с остальными нет.
#
# Отдать карты обучению можно через служебный порт, он слушает только 127.0.0.1
#
#   curl -XPOST localhost:4999/admin/training -d '{"vram_gb": 14, "pid": 12345}'
#       прокси сама наберёт минимум карт под этот объём и возьмёт те, что
#       меньше всего мешают моделям, приоритетные трогает последними
#
#   curl -XPOST localhost:4999/admin/training -d '{"gpus": [1], "pid": 12345}'
#       забрать конкретные карты
#
#   curl -XPOST localhost:4999/admin/training -d '{"pid": 12345}'
#       забрать все карты
#
#   curl -XDELETE localhost:4999/admin/training/LEASE_ID
#       вернуть карты моделям
#
# Ответ приходит, когда модели на картах уже погашены, и содержит free_gb.
# Поле pid указывать стоит. Если процесс обучения умрёт, не сняв аренду,
# прокси заметит это в течение 15 секунд и вернёт карты сама.

internal_ports: [6100, 6199]   # внутренние порты инстансов, берутся по порядку с шагом 10
admin_port: 4999               # служебный порт, слушает только 127.0.0.1

# api_key
#   Пока ключ не задан, порты 5000 и 6000 слушают 0.0.0.0 и пускают кого
#   угодно. С ключом нужен заголовок Authorization со значением Bearer
#   и самим ключом. Раскомментируйте строку ниже и подставьте секрет.
# api_key: положите-сюда-секрет

reserve_gb: 1.0         # запас памяти на карте, чтобы не упереться в фрагментацию

# Сколько ГБ модель держит на карте, пока спит. Это значение надо замерить
# и поправить. На первом засыпании каждой модели прокси напишет в лог
# реальное число и сравнит его с конфигом. Дальше она считает по замеру,
# но размещение при старте решается по этому числу, поэтому заниженное
# значение ломает preload. Текущие 1.5 это осторожная оценка, лучше
# завысить, чем занизить.
asleep_tail_gb: 1.5

idle_sleep_sec: 120     # столько простоя и модель усыпляется
idle_stop_sec: 3600     # столько простоя во сне и модель останавливается совсем

# Только что проснувшуюся модель не выселяют ради другой, пока ею продолжают
# пользоваться. Это защита от тряски, когда две модели одного порта дёргают
# по очереди. Цена такая, встречный запрос к соседке ждёт до 30 секунд.
min_residency_sec: 30

start_timeout: 900      # сколько ждём подъёма инстанса с нуля
switch_timeout: 120     # сколько ждём засыпания или пробуждения

# Сколько запрос ждёт освобождения места на карте. Общий потолок ожидания
# складывается из queue_timeout и start_timeout.
queue_timeout: 180

drain_timeout: 600      # сколько даём доработать запросам, когда карту забирает обучение
preload: true           # поднять все модели при старте или поднимать по первому запросу

# Окружение для всех инстансов. Переменная HF_HOME обязательна, без неё vLLM
# не найдёт локальный кэш HuggingFace и полезет качать чекпоинты заново.
env:
  HF_HOME: /home/jovyan/work/lora_env/huggingface_model
  LD_LIBRARY_PATH: /opt/conda/lib:/opt/conda/targets/x86_64-linux/lib

models:
  grade-ai:
    vram_gb: 11.2
    port: 6000
    # Держим наготове. Уборка её не усыпляет, а если её всё же вытеснили,
    # прокси будит её сама, как только на карте появится место.
    priority: true
    cwd: /home/jovyan/work/lora_env/grade_ai
    script: /home/jovyan/work/lora_env/grade_ai/run_grade_ai.sh
    aliases: ["/home/jovyan/work/lora_env/ya_gpt/v2/epoch_2"]

  detector-14b:
    vram_gb: 11.2
    port: 6000
    cwd: /home/jovyan/work/violation_detector
    script: /home/jovyan/work/violation_detector/run_detector.sh
    aliases: ["Qwen/Qwen3-14B-AWQ"]

  test-gen:
    vram_gb: 12.8
    port: 5000
    cwd: /home/jovyan/work/task_generator
    script: /home/jovyan/work/task_generator/run_test_gen.sh
    aliases: ["tasks_v2_r2_merged"]

  detector-4b:
    vram_gb: 12.8
    port: 5000
    cwd: /home/jovyan/work/violation_detector
    script: /home/jovyan/work/violation_detector/run_detector_v2.sh
    aliases: ["Qwen/Qwen3.5-4B"]
