# Раскладка портов:
#   :6000 — grade-ai и detector-14b
#   :5000 — test-gen и detector-4b
# На обоих портах по две модели, поэтому поле model в запросе ОБЯЗАТЕЛЬНО
# и должно быть либо именем модели, либо одним из её aliases. Всё остальное
# прокси отвергнет с 400. «Любым» поле model может быть только там,
# где на порту ровно одна модель.
#
# Команда запуска у каждой модели своя и лежит в собственном скрипте.
# Прокси передаёт ему VLLM_PORT, VLLM_SERVED_NAME, VLLM_SERVER_DEV_MODE=1
# и CUDA_VISIBLE_DEVICES, а карту выбирает сама — в скрипте её жёстко
# задавать не нужно. Скрипт обязан прокинуть три вещи, иначе не заработает:
#   --port "$VLLM_PORT"
#   --served-model-name "$VLLM_SERVED_NAME"   # иначе 404 на каждый запрос:
#       # запуск идёт через script, поэтому aliases в vLLM не передаются,
#       # и прокси переписывает поле model в каноническое имя из этого файла
#   --enable-sleep-mode                        # иначе /sleep вернёт 404,
#       # прокси перестанет усыплять модель и будет её останавливать,
#       # а каждое переключение станет холодным стартом на минуты
#
# gpu-memory-utilization в скрипте — доля всей памяти карты, которую vLLM
# заберёт независимо от размера весов. Что не ушло под веса, уйдёт под
# KV-кэш. vram_gb здесь должен совпадать с тем, что реально заберёт
# инстанс: доля × объём карты. Здесь карты по 16 ГБ, то есть
# 11.2 = 0.7 × 16 и 12.8 = 0.8 × 16.
#
# Железо: 2 карты по 16 ГБ. Одновременно активны максимум две модели,
# по одной на карту — две сразу на одну карту не влезают. Остальные спят,
# держа на карте только CUDA-контекст (asleep_tail_gb). Прокси сама решает,
# кого разбудить и кого усыпить, по входящим запросам.
#
# Добавлять модели в этот файл можно без правок кода. Но на 2×16 ГБ запас
# такой: 2 активных + столько спящих, сколько влезет остатками. При
# asleep_tail_gb 1.5 это ещё 3 модели, то есть всего 5. Каждая сверх того
# будет при переключении не усыпляться, а останавливаться — следующий
# запрос к ней получит холодный старт. Прокси предупредит об этом в логе
# строкой «ни на одной карте нет места держать её спящей рядом с остальными».
# Модель на новом порту требует перезапуска прокси: порты слушаются при старте.
#
# Отдать карты обучению (служебный порт только на 127.0.0.1):
#   curl -XPOST localhost:4999/admin/training -d '{"vram_gb": 14, "pid": 12345}'
#       — прокси сама наберёт минимум карт под этот объём и возьмёт те,
#         что меньше всего мешают моделям (приоритетные трогает последними)
#   curl -XPOST localhost:4999/admin/training -d '{"gpus": [1], "pid": 12345}'
#       — конкретные карты
#   curl -XPOST localhost:4999/admin/training -d '{"pid": 12345}'
#       — все карты
#   curl -XDELETE localhost:4999/admin/training/<id>
#       — вернуть карты моделям
# Ответ приходит, когда модели на картах уже погашены, и содержит free_gb.
# pid указывать стоит: если процесс обучения умрёт, не сняв аренду,
# прокси заметит это в течение 15 секунд и вернёт карты сама.

internal_ports: [6100, 6199]   # внутренние порты инстансов, берутся по порядку с шагом 10
admin_port: 4999               # служебный порт, слушает только 127.0.0.1

# api_key: "положите-сюда-секрет"
#   Пока не задан, :5000 и :6000 слушают 0.0.0.0 и пускают кого угодно.
#   С ключом нужен заголовок Authorization: Bearer <api_key>.

reserve_gb: 1.0         # запас памяти на карте, чтобы не упереться в фрагментацию
asleep_tail_gb: 1.5     # сколько ГБ модель держит на карте, пока спит.
                        # ЗАМЕРЬТЕ и поправьте: на первом засыпании каждой модели
                        # прокси напишет в лог «X во сне держит N ГБ, а
                        # asleep_tail_gb в конфиге M». Дальше она считает по замеру,
                        # но размещение при старте решается по этому числу, поэтому
                        # заниженное значение ломает preload. Текущие 1.5 —
                        # осторожная оценка, лучше завысить, чем занизить.
sleep_level: 1          # 1 — веса уезжают в RAM (нужно ~10 ГБ хостовой памяти на
                        # каждую спящую модель); 2 — выгружаются полностью,
                        # пробуждение медленнее

idle_sleep_sec: 120     # столько простоя — и модель усыпляется
idle_stop_sec: 3600     # столько простоя во сне — и модель останавливается совсем
min_residency_sec: 30   # только что проснувшуюся модель не выселяют ради другой,
                        # пока ею продолжают пользоваться. Защита от тряски, когда
                        # две модели одного порта дёргают по очереди. Цена: встречный
                        # запрос к соседке ждёт до 30 сек

start_timeout: 900      # сколько ждём подъёма инстанса с нуля
switch_timeout: 120     # сколько ждём засыпания или пробуждения
queue_timeout: 180      # сколько запрос ждёт освобождения места на карте.
                        # Общий потолок ожидания = queue_timeout + start_timeout
drain_timeout: 600      # сколько даём доработать запросам, когда карту забирает обучение

preload: true           # поднять все модели при старте / поднимать по первому запросу

# Окружение для всех инстансов. HF_HOME обязателен: без него vLLM не найдёт
# локальный кэш HuggingFace и полезет качать чекпоинты заново.
env:
  HF_HOME: /home/jovyan/work/lora_env/huggingface_model
  LD_LIBRARY_PATH: /opt/conda/lib:/opt/conda/targets/x86_64-linux/lib

models:
  grade-ai:
    vram_gb: 11.2
    port: 6000
    priority: true          # держим наготове: уборка её не усыпляет, а если её
                            # всё же вытеснили, прокси будит её сама, как только
                            # на карте появится место
    cwd: /home/jovyan/work/lora_env/grade_ai
    script: /home/jovyan/work/lora_env/grade_ai/run_grade_ai.sh
    aliases: ["/home/jovyan/work/lora_env/ya_gpt/v2/epoch_2"]

  detector-14b:
    vram_gb: 11.2
    port: 6000
    cwd: /home/jovyan/work/violation_detector
    script: /home/jovyan/work/violation_detector/run_detector.sh
    aliases: ["Qwen/Qwen3-14B-AWQ"]

  test-gen:
    vram_gb: 12.8
    port: 5000
    cwd: /home/jovyan/work/task_generator
    script: /home/jovyan/work/task_generator/run_test_gen.sh
    aliases: ["tasks_v2_r2_merged"]

  detector-4b:
    vram_gb: 12.8
    port: 5000
    cwd: /home/jovyan/work/violation_detector
    script: /home/jovyan/work/violation_detector/run_detector_v2.sh
    aliases: ["Qwen/Qwen3.5-4B"]
